<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>A brain needs a body</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light dark;
    --bg: light-dark(#fbf7ef, #15131a);
    --dot: light-dark(#e4dccb, #2a2633);
    --fg: light-dark(#1d1a24, #f1ecff);
    --muted: light-dark(#7a7268, #9a93ab);
    --accent: light-dark(#ff5a36, #ff7a59);
    --mech: light-dark(#ffc23d, #f0a92a);
    --mech-dark: light-dark(#3b3346, #5b5070);
    --plate: light-dark(#fff4d6, #2e2516);
    --glass: light-dark(#d6eeff, #1d3346);
    --brain: light-dark(#ff9ec4, #ff8dbb);
    --skin: light-dark(#f2c6a0, #e0b48e);
    --shirt: light-dark(#2bb39b, #2aa38e);
    --device: light-dark(#e8e2f4, #2b2737);
    --wood: light-dark(#c98f5a, #8a5d36);
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; color: var(--fg);
         background: var(--bg) radial-gradient(var(--dot) 1.5px, transparent 1.6px) 0 0 / 22px 22px;
         font-family: "Bricolage Grotesque", system-ui, sans-serif; }
  main { width: min(1200px, 100%); padding: 2.5rem 1rem; }
  h1 { font-weight: 800; font-size: clamp(2rem, 6vw, 4rem); letter-spacing: -.04em; line-height: 1; margin: 0 0 1.5rem 1rem; }
  h1 span { color: var(--accent); }
  svg { width: 100%; height: auto; display: block; overflow: visible; }
  .o { stroke: var(--fg); stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; }
  text { fill: var(--fg); font-family: "Bricolage Grotesque", system-ui, sans-serif; }
  .lbl { font-size: 30px; font-weight: 800; }
  .ex { font-size: 17px; fill: var(--muted); font-weight: 500; }
  .mono { font-family: "JetBrains Mono", monospace; }
</style>
</head>
<body>
<main>
  <h1>A brain needs a <span>body</span>.</h1>

  <svg viewBox="0 0 1200 680" role="img" aria-label="A human talks through an interface to an agent: a robot whose body is the harness and whose brain is the LLM.">
    <!-- ground -->
    <path class="o" d="M20 580 H1180" stroke-width="3"/>

    <!-- HUMAN -->
    <g>
      <rect class="o" x="40" y="168" width="232" height="64" rx="22" fill="var(--bg)"/>
      <path class="o" d="M110 230 L120 262 L140 230" fill="var(--bg)"/>
      <path d="M112 228 H138" stroke="var(--bg)" stroke-width="6"/>
      <text x="156" y="208" text-anchor="middle" style="font-size:21px;font-weight:500">make the tests pass!</text>

      <rect class="o" x="100" y="450" width="26" height="120" rx="8" fill="var(--mech-dark)"/>
      <rect class="o" x="136" y="450" width="26" height="120" rx="8" fill="var(--mech-dark)"/>
      <ellipse class="o" cx="118" cy="572" rx="22" ry="9" fill="#2a2230"/>
      <ellipse class="o" cx="156" cy="572" rx="22" ry="9" fill="#2a2230"/>
      <rect class="o" x="90" y="340" width="82" height="128" rx="32" fill="var(--shirt)"/>
      <path d="M160 372 Q210 380 262 404" stroke="var(--fg)" stroke-width="24" stroke-linecap="round" fill="none"/>
      <path d="M160 372 Q210 380 262 404" stroke="var(--skin)" stroke-width="16" stroke-linecap="round" fill="none"/>
      <circle class="o" cx="132" cy="300" r="38" fill="var(--skin)"/>
      <path class="o" d="M96 292 C96 252 160 248 170 284 C150 276 126 270 96 292 Z" fill="#2a2230"/>
      <circle cx="142" cy="304" r="4" fill="var(--fg)"/>
      <circle cx="160" cy="304" r="4" fill="var(--fg)"/>
      <path class="o" d="M146 318 Q154 324 162 318" fill="none" stroke-width="3"/>
      <text class="lbl" x="132" y="630" text-anchor="middle">Human</text>
    </g>

    <!-- INTERFACE -->
    <g>
      <rect class="o" x="250" y="514" width="262" height="16" rx="5" fill="var(--wood)"/>
      <path class="o" d="M270 530 V578 M492 530 V578" stroke-width="8"/>
      <rect class="o" x="364" y="448" width="34" height="58" fill="var(--device)"/>
      <rect class="o" x="326" y="500" width="110" height="14" rx="6" fill="var(--device)"/>
      <rect class="o" x="270" y="300" width="222" height="152" rx="16" fill="var(--device)"/>
      <rect x="286" y="316" width="190" height="116" rx="6" fill="#1b1826"/>
      <circle cx="300" cy="330" r="4.5" fill="#ff5f57"/><circle cx="314" cy="330" r="4.5" fill="#febc2e"/><circle cx="328" cy="330" r="4.5" fill="#28c840"/>
      <text class="mono" x="300" y="368" style="font-size:18px;fill:#7ee787">&gt; fix it</text>
      <rect x="390" y="353" width="11" height="19" fill="#7ee787"/>
      <text class="mono" x="300" y="398" style="font-size:14px;fill:#8b86a3">thinking…</text>
      <text class="lbl" x="381" y="630" text-anchor="middle">Interface</text>
      <text class="ex" x="381" y="658" text-anchor="middle">T3 Code · Codex App · TUIs · GUIs</text>
    </g>

    <!-- cable -->
    <path d="M492 390 C570 390 560 548 640 548 C710 548 690 450 742 450" fill="none" stroke="var(--fg)" stroke-width="12" stroke-linecap="round"/>
    <path d="M492 390 C570 390 560 548 640 548 C710 548 690 450 742 450" fill="none" stroke="var(--accent)" stroke-width="5" stroke-linecap="round"/>

    <!-- AGENT boundary -->
    <rect x="600" y="40" width="575" height="560" rx="44" fill="none" stroke="var(--accent)" stroke-width="4" stroke-dasharray="16 12"/>
    <g transform="rotate(-4 705 42)">
      <rect class="o" x="626" y="16" width="158" height="52" rx="14" fill="var(--accent)"/>
      <text x="705" y="53" text-anchor="middle" style="font-size:32px;font-weight:800;fill:#fff;letter-spacing:.06em">AGENT</text>
    </g>

    <!-- mech legs -->
    <rect class="o" x="792" y="490" width="56" height="74" rx="10" fill="var(--mech-dark)"/>
    <rect class="o" x="912" y="490" width="56" height="74" rx="10" fill="var(--mech-dark)"/>
    <rect class="o" x="774" y="556" width="90" height="24" rx="12" fill="var(--mech)"/>
    <rect class="o" x="896" y="556" width="90" height="24" rx="12" fill="var(--mech)"/>

    <!-- arms + tools -->
    <path d="M752 346 L702 420 L694 470" fill="none" stroke="var(--fg)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M752 346 L702 420 L694 470" fill="none" stroke="var(--mech-dark)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M1008 346 L1058 420 L1066 462" fill="none" stroke="var(--fg)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M1008 346 L1058 420 L1066 462" fill="none" stroke="var(--mech-dark)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="rotate(-30 680 500)">
      <rect class="o" x="671" y="470" width="20" height="78" rx="8" fill="#b8c2cc"/>
      <path class="o" d="M662 470 a20 20 0 1 1 38 0 l-8 0 l0 -14 l-22 0 l0 14 Z" fill="#b8c2cc"/>
    </g>
    <g transform="rotate(10 1070 500)">
      <path class="o" d="M1042 460 H1082 L1100 478 V532 H1042 Z" fill="#fff"/>
      <path class="o" d="M1082 460 V478 H1100" fill="none" stroke-width="3"/>
      <path d="M1052 494 H1088 M1052 506 H1088 M1052 518 H1076" stroke="#8b86a3" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- body = harness -->
    <rect class="o" x="748" y="304" width="264" height="194" rx="36" fill="var(--mech)"/>
    <rect class="o" x="776" y="332" width="208" height="134" rx="18" fill="var(--plate)" stroke-width="3"/>
    <circle cx="764" cy="320" r="5" fill="var(--fg)"/><circle cx="996" cy="320" r="5" fill="var(--fg)"/>
    <circle cx="764" cy="482" r="5" fill="var(--fg)"/><circle cx="996" cy="482" r="5" fill="var(--fg)"/>
    <text class="lbl" x="880" y="384" text-anchor="middle" style="font-size:34px">Harness</text>
    <text class="ex" x="880" y="416" text-anchor="middle">Claude Agent SDK</text>
    <text class="ex" x="880" y="442" text-anchor="middle">Codex CLI · Pi</text>

    <!-- neck + dome = llm -->
    <rect class="o" x="812" y="280" width="136" height="28" rx="9" fill="var(--mech-dark)"/>
    <circle class="o" cx="880" cy="186" r="100" fill="var(--glass)"/>
    <path class="o" d="M822 220 C808 168 856 140 880 160 C904 140 954 168 940 220 C950 258 902 268 880 250 C858 268 810 258 822 220 Z" fill="var(--brain)"/>
    <path d="M880 160 V246 M846 178 c14 8 -6 20 8 30 M914 176 c-12 10 6 20 -6 32 M834 232 c10 -4 18 2 22 -8 M926 232 c-10 -4 -18 2 -22 -8" fill="none" stroke="var(--fg)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="862" cy="214" r="5" fill="var(--fg)"/><circle cx="898" cy="214" r="5" fill="var(--fg)"/>
    <path d="M826 118 A80 80 0 0 1 900 102" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity=".7"/>

    <path class="o" d="M972 150 L1030 112" fill="none" stroke-width="3" stroke-dasharray="2 8"/>
    <text class="lbl" x="1038" y="108" style="font-size:36px">LLM</text>
    <text class="ex" x="1038" y="134">Claude, GPT, …</text>
  </svg>
</main>
</body>
</html>
