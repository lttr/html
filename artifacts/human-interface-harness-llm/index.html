<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Where the agent is</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: light-dark(#fafaf9, #111113);
    --fg: light-dark(#18181b, #ececee);
    --muted: light-dark(#71717a, #8b8b94);
    --node: light-dark(#ffffff, #1b1b1f);
    --edge: light-dark(#d4d4d8, #34343a);
    --accent: light-dark(#d9480f, #ff8a3d);
    --accent-soft: light-dark(#fff1e8, #2a1a10);
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
         font: 16px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { width: min(1100px, 100%); padding: 3rem 1.5rem; }
  h1 { font-size: clamp(1.6rem, 3.5vw, 2.4rem); font-weight: 650; letter-spacing: -.025em; margin: 0 0 3.5rem; }

  .flow { display: flex; align-items: center; }
  .node { background: var(--node); border: 1px solid var(--edge); border-radius: 14px; padding: 1.1rem 1.25rem; min-width: 0; }
  .node h2 { margin: 0; font-size: 1.15rem; font-weight: 600; }
  .node small { display: block; margin-top: .35rem; color: var(--muted); font-size: .82rem; line-height: 1.5; }
  .human { border: none; background: none; padding: 0; text-align: center; flex: 0 0 auto; }
  .human svg { display: block; width: 34px; margin: 0 auto .5rem; stroke: var(--fg); }
  .interface { flex: 0 1 190px; }

  .wire { flex: 0 0 64px; height: 28px; color: var(--muted); }
  .wire svg { width: 100%; height: 100%; }

  .agent { position: relative; flex: 1; display: flex; align-items: center; gap: 0;
           border: 2px solid var(--accent); background: var(--accent-soft); border-radius: 22px; padding: 2.2rem 1.4rem 1.4rem; }
  .agent > b { position: absolute; top: -.95rem; left: 1.4rem; background: var(--accent); color: var(--bg);
               font-size: 1.05rem; letter-spacing: .02em; padding: .25rem .9rem; border-radius: 99px; }
  .agent .node { flex: 1; border-color: color-mix(in oklab, var(--accent) 35%, var(--edge)); }
  .loop { flex: 0 0 92px; height: 70px; color: var(--accent); }
  .loop svg { width: 100%; height: 100%; }

  @media (max-width: 820px) {
    .flow, .agent { flex-direction: column; align-items: stretch; }
    .interface, .human { flex: none; }
    .wire { flex: none; height: 48px; width: 28px; align-self: center; }
    .wire svg { transform: rotate(90deg); width: 48px; height: 28px; margin-left: -10px; margin-top: 10px; }
    .loop { flex: none; height: 92px; width: 70px; align-self: center; }
    .loop svg { transform: rotate(90deg); width: 92px; height: 70px; margin-left: -11px; margin-top: 11px; }
  }
</style>
</head>
<body>
<main>
  <h1>Where the agent is</h1>

  <div class="flow">
    <div class="node human">
      <svg viewBox="0 0 40 52" fill="none" stroke-width="2.2" stroke-linecap="round"><circle cx="20" cy="11" r="8"/><path d="M5 50V37a15 15 0 0 1 30 0v13"/></svg>
      <h2>Human</h2>
    </div>

    <div class="wire"><svg viewBox="0 0 64 28" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9h52m-5-4 5 4-5 4M58 19H6m5-4-5 4 5 4"/></svg></div>

    <div class="node interface">
      <h2>Interface</h2>
      <small>T3 Code, Codex App,<br>TUIs, GUIs</small>
    </div>

    <div class="wire"><svg viewBox="0 0 64 28" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9h52m-5-4 5 4-5 4M58 19H6m5-4-5 4 5 4"/></svg></div>

    <section class="agent">
      <b>Agent</b>
      <div class="node">
        <h2>Harness</h2>
        <small>Claude Agent SDK, Codex CLI, Pi<br>tools · context · permissions</small>
      </div>
      <div class="loop"><svg viewBox="0 0 92 70" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10 28C22 8 70 8 82 28m-8-2 8 2 2-8"/>
        <path d="M82 42C70 62 22 62 10 42m8 2-8-2-2 8"/>
      </svg></div>
      <div class="node">
        <h2>LLM</h2>
        <small>Claude, GPT, …<br>stateless, tokens in → tokens out</small>
      </div>
    </section>
  </div>
</main>
</body>
</html>
