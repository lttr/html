<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>What is an agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light dark;
    --bg: light-dark(#f6f4ef, #121214);
    --fg: light-dark(#151515, #f1f1f3);
    --muted: light-dark(#6f6c66, #9a9aa3);
    --tile: light-dark(#ffffff, #1c1c20);
    --shadow: light-dark(#151515, #000000);
    --accent: light-dark(#5b3cf5, #a08cff);
    --tint: light-dark(#ece7ff, #241e44);
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
         font-family: "Bricolage Grotesque", system-ui, sans-serif; }
  main { width: min(1160px, 100%); padding: 3rem 1.5rem; }
  h1 { font-size: clamp(2.2rem, 6vw, 4.2rem); font-weight: 800; letter-spacing: -.04em; line-height: 1; margin: 0 0 3.5rem; }
  h1 em { font-style: normal; color: var(--accent); }

  .row { display: grid; grid-template-columns: auto 56px 1fr 56px 2.4fr; align-items: center; }
  .tile { background: var(--tile); border: 2.5px solid var(--fg); border-radius: 16px; padding: 1.1rem 1.2rem;
          box-shadow: 5px 5px 0 var(--shadow); }
  .tile b { display: block; font-size: 1.45rem; font-weight: 800; letter-spacing: -.02em; }
  .tile span { display: block; margin-top: .3rem; font-size: .9rem; color: var(--muted); line-height: 1.4; }
  .human { text-align: center; padding: 1.1rem 1.4rem; }
  .human svg { width: 30px; display: block; margin: 0 auto .35rem; stroke: var(--fg); }

  .wire { color: var(--muted); display: grid; place-items: center; }
  .wire svg { width: 40px; height: 22px; }

  .agent { display: grid; grid-template-columns: 1fr 56px 1fr; align-items: center; position: relative; }
  .agent .tile { background: var(--tint); border-color: var(--accent); box-shadow: 5px 5px 0 var(--accent); }
  .agent .wire { color: var(--accent); }
  .brace { position: absolute; top: calc(100% + 1rem); left: 0; right: 0; color: var(--accent); }
  .row { margin-bottom: 6rem; }
  .brace svg { display: block; width: 100%; height: 26px; }
  .brace p { margin: .35rem 0 0; text-align: center; font-size: 2.2rem; font-weight: 800; letter-spacing: -.03em; }

  @media (max-width: 860px) {
    .row { grid-template-columns: 1fr; }
    .wire svg { transform: rotate(90deg); margin: .6rem 0; }
    .agent { grid-template-columns: 1fr; border-left: 4px solid var(--accent); padding-left: 1rem; position: relative; }
    .brace { position: static; margin: 0; }
    .row { margin-bottom: 0; }
    .brace svg { display: none; }
    .brace p { text-align: left; }
  }
</style>
</head>
<body>
<main>
  <h1>What is an <em>agent</em>?</h1>

  <div class="row">
    <div class="tile human">
      <svg viewBox="0 0 40 44" fill="none" stroke-width="3" stroke-linecap="round"><circle cx="20" cy="11" r="8"/><path d="M5 42v-9a15 15 0 0 1 30 0v9"/></svg>
      <b>Human</b>
    </div>

    <div class="wire"><svg viewBox="0 0 40 22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h32m-5-4 5 4-5 4M36 15H4m5-4-5 4 5 4"/></svg></div>

    <div class="tile">
      <b>Interface</b>
      <span>T3 Code, Codex App, TUIs, GUIs</span>
    </div>

    <div class="wire"><svg viewBox="0 0 40 22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h32m-5-4 5 4-5 4M36 15H4m5-4-5 4 5 4"/></svg></div>

    <div class="agent">
      <div class="tile">
        <b>Harness</b>
        <span>Claude Agent SDK, Codex CLI, Pi</span>
      </div>
      <div class="wire"><svg viewBox="0 0 40 22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h32m-5-4 5 4-5 4M36 15H4m5-4-5 4 5 4"/></svg></div>
      <div class="tile">
        <b>LLM</b>
        <span>Claude, GPT, …</span>
      </div>
      <div class="brace">
        <svg viewBox="0 0 400 26" preserveAspectRatio="none" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <path vector-effect="non-scaling-stroke" d="M2 2 Q2 13 20 13 H180 Q200 13 200 24 Q200 13 220 13 H380 Q398 13 398 2"/>
        </svg>
        <p>Agent</p>
      </div>
    </div>
  </div>
</main>
</body>
</html>
